services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sw
      POSTGRES_PASSWORD: sw
      POSTGRES_DB: scopewallet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates a separate scopewallet_test database the first time the volume is created.
      - ./server/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sw -d scopewallet"]
      interval: 5s
      retries: 10

  # Optional: run the API itself in Docker (use `docker compose --profile api up --build`).
  api:
    profiles: ["api"]
    build: ./server
    environment:
      DATABASE_URL: postgresql://sw:sw@db:5432/scopewallet
      JWT_SECRET: local-docker-secret
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
